    #mobile-game-dashboard .axis, #mobile-game-dashboard .stage-label, #mobile-game-dashboard .axis-title, #mobile-game-dashboard .point-label { fill: var(--ink); font-size: 12px; }

      #mobile-game-dashboard .svg-box { height: 580px; }

        const rpd = revenuePerDownloadBucketFor(d.revenuePerDownload);
        const radius = 5.2 + Math.min(4.2, Math.log10(Math.max(1, d.downloads)) - 6.7);
        const circle = g('circle', {
          cx: x(d.perCapitaDownloads), cy: y(d.mobileIndex), r: Math.max(4.8, radius),
          fill: rpd.color, class: 'point' + (d === selected ? ' active' : ''), tabindex: 0,
          'aria-label': `${d.country} Mobile Index ${fmtNum(d.mobileIndex, 1)} 游戏人均下载 ${fmtNum(d.perCapitaDownloads, 1)}`
        });
        circle.addEventListener('mouseenter', ev => showTip(ev, d));
        circle.addEventListener('mousemove', ev => showTip(ev, d));
        circle.addEventListener('mouseleave', hideTip);
        circle.addEventListener('click', () => { selected = d; renderDetail(d); draw(); });
        circle.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selected = d; renderDetail(d); draw(); } });
        if (labeled.has(d.country) && width > 620) {
          const dx = d.country === '伊拉克' ? -10 : 8;
          const dy = d.country === '伊拉克' ? 18 : -8;
          const anchor = d.country === '伊拉克' ? 'end' : 'start';
          addText(d.country, { x: x(d.perCapitaDownloads) + dx, y: y(d.mobileIndex) + dy, class: 'point-label', 'text-anchor': anchor });
        }
      });
    }
    function showTip(ev, d) {
      const st = stageFor(d.mobileIndex);
      tooltip.innerHTML = `<strong>${d.country} · ${st.name}</strong>Mobile Index：${fmtNum(d.mobileIndex, 2)}<br>人均下载：${fmtNum(d.perCapitaDownloads, 2)}<br>收入/下载：${d.revenuePerDownload == null ? '—' : '$' + fmtNum(d.revenuePerDownload, 3)}`;
      tooltip.style.left = ev.clientX + 'px';
      tooltip.style.top = ev.clientY + 'px';
      tooltip.style.opacity = '1';
    }
    function hideTip() { tooltip.style.opacity = '0'; }
    renderMetrics();
    renderLegend();
    renderDetail(selected);
    draw();
    new ResizeObserver(draw).observe(svg.parentElement);
    const tabButtons = Array.from(root.querySelectorAll('.tab-button'));
    const tabPanels = Array.from(root.querySelectorAll('.tab-panel'));
    const tab2Frame = document.getElementById('tab2Frame');
    function resizeTab2Frame() {
      if (!tab2Frame) return;
      try {
        const doc = tab2Frame.contentDocument || tab2Frame.contentWindow.document;
        const height = Math.max(
          920,
          doc.documentElement.scrollHeight,
          doc.body ? doc.body.scrollHeight : 0
        );
        tab2Frame.style.height = height + 24 + 'px';
      } catch (error) {
        tab2Frame.style.height = '1120px';
      }
    }
    function activateTab(panelId) {
      tabButtons.forEach(button => {
        const active = button.dataset.tabTarget === panelId;
        button.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      tabPanels.forEach(panel => {
        const active = panel.id === panelId;
        panel.classList.toggle('active', active);
        panel.hidden = !active;
      });
      if (panelId === 'tab1Panel') {
        requestAnimationFrame(draw);
      }
      if (panelId === 'tab2Panel') {
        requestAnimationFrame(resizeTab2Frame);
      }
    }
    tabButtons.forEach((button, index) => {
      button.addEventListener('click', () => activateTab(button.dataset.tabTarget));
      button.addEventListener('keydown', event => {
        const { key } = event;
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(key)) return;
        event.preventDefault();
        let nextIndex = index;
        if (key === 'ArrowLeft') nextIndex = (index - 1 + tabButtons.length) % tabButtons.length;
        if (key === 'ArrowRight') nextIndex = (index + 1) % tabButtons.length;
        if (key === 'Home') nextIndex = 0;
        if (key === 'End') nextIndex = tabButtons.length - 1;
        const nextButton = tabButtons[nextIndex];
        nextButton.focus();
        activateTab(nextButton.dataset.tabTarget);
      });
    });
    if (tab2Frame) {
      tab2Frame.addEventListener('load', resizeTab2Frame);
    }
  })();
  </script>
</div>
</body>
</html>
